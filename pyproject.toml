[project]
name = "aep-review"
version = "0.1.0"
description = "American English Podcast (Shana) 복습 PWA — RSS + faster-whisper + claude-agent-sdk"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.4",
    "feedparser>=6.0",
    "httpx>=0.28",
    "faster-whisper>=1.0",
    "claude-agent-sdk>=0.1",
    "python-dotenv>=1.0",
    "edge-tts>=7.0",
    "boto3>=1.34",   # R2(S3 호환) 오디오 업로드
    "yt-dlp>=2026.7",  # White House 브리핑 오디오 추출(ingest/wh_fetch.py; ffmpeg 필요)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

# ── ruff ─────────────────────────────────────────────────────────────────────
# 목표: '통과하는 린트 게이트'. 이전엔 76건이 상시 빨간불이라 아무도 보지 않았고, 그래서 그 안에
# 섞인 진짜 신호(미사용 변수 = 검증에 안 쓰인 수집값, 미사용 import)가 묻혀 있었다.
# 실제 신호는 전부 고쳤고, 남은 E701/E702 는 검증 스크립트의 지배적 관용구라 파일 단위로 면제한다.
# 앱 코드(ingest/)에는 면제가 없다 — 규칙을 그대로 지킨다.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# 하니스/검증 스크립트는 'pg.evaluate(...); time.sleep(...)' 처럼 '동작 + 그 동작의 대기'를 한 줄에
# 붙여 쓰는 스타일이 76곳에 걸쳐 일관된다. 줄을 쪼개면 인과가 흩어져 오히려 읽기 나빠진다.
"scripts/_pwtest.py" = ["E701", "E702"]
"scripts/verify_done.py" = ["E701", "E702"]
"scripts/verify_hosting.py" = ["E701", "E702"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingest*"]
