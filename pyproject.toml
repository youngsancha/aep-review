[project]
name = "aep-review"
version = "0.1.0"
description = "American English Podcast (Shana) 복습 PWA — RSS + faster-whisper + claude-agent-sdk"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.4",
    "feedparser>=6.0",
    "httpx>=0.28",
    "faster-whisper>=1.0",
    "claude-agent-sdk>=0.1",
    "python-dotenv>=1.0",
    "edge-tts>=7.0",
    "boto3>=1.34",   # R2(S3 호환) 오디오 업로드
    "yt-dlp>=2026.7",  # White House 브리핑 오디오 추출(ingest/wh_fetch.py; ffmpeg 필요)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingest*"]
