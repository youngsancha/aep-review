# White House 브리핑 인제스트 (E-Podcast 3번째 쇼 'wh').
# whitehouse.gov 브리핑 목록 스크레이프 → yt-dlp 오디오 추출 → Supabase episodes(show='wh') insert
# → R2 {id}.mp3 업로드 → R2 재STT(transcript r2_audio=true). vocab 은 CI 생략(로컬 Claude).
#
# 필요한 repo secrets (aep-sync / aep-r2-upload 와 동일 세트 재사용):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
# R2_PUBLIC_BASE 는 공개 URL(비밀 아님, ui/config.js 와 동일 오리진).
#
# 수동 실행: Actions → wh-sync → Run workflow (limit 입력). 주 3회 스케줄은 아래.

name: wh-sync

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "최신 미적재 브리핑 몇 개까지 (기본 3)"
        required: false
        default: "3"
      cspan_urls:
        description: "C-SPAN 프로그램 URL 콤마구분(반자동, 쿠키불필요). 넣으면 자동발견 대신 이것만 적재"
        required: false
        default: ""
  schedule:
    # 주 3회(월·수·금) 17:30 UTC / 02:30 KST — aep-sync(16:00) 이후, 브리핑 빈도에 맞춰 저빈도.
    - cron: "30 17 * * 1,3,5"

permissions:
  contents: read

concurrency:
  group: wh-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg (yt-dlp 오디오 추출용)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: pip install -e .

      # faster-whisper 모델 캐시(aep-sync 와 동일 키 공유)
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-medium-en-v1

      - name: Ingest White House briefings (STT from R2; vocab runs locally)
        env:
          AEP_WHISPER_DEVICE: cpu
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: https://pub-6226ae33abbc474dbea6ae140582eb8d.r2.dev
          # 선택: YouTube 봇차단 우회용 쿠키(넷스케이프 형식 파일 내용). player_client 우회가 실패하면
          # Repo Settings → Secrets → Actions 에 YT_COOKIES 추가(브라우저 확장으로 youtube.com 쿠키 export).
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          CSPAN_URLS: ${{ github.event.inputs.cspan_urls }}
        run: |
          if [ -n "$CSPAN_URLS" ]; then
            python -m ingest.wh_fetch --cspan-urls "$CSPAN_URLS"
          else
            python -m ingest.wh_fetch --limit ${{ github.event.inputs.limit || 3 }}
          fi
