# 매일 신규 에피소드 인제스트 → Supabase 에 write.
# 결과(transcript/vocab/tts)는 Supabase Postgres + Storage 로 직접 들어간다(데이터 repo 없음).
#
# 필요한 repo secret:
#   SUPABASE_URL          — 프로젝트 URL
#   SUPABASE_SERVICE_KEY  — service_role 키 (RLS 우회)
#
# vocab 추출(claude CLI)은 CI 인증이 어려워 여기선 --no-vocab.
# vocab+TTS 는 로컬(Claude Max)에서 `python -m ingest.cron_fetch` 로 별도 처리.

name: aep-sync

on:
  schedule:
    - cron: '0 16 * * *'   # 매일 UTC 16:00 (KST 01:00)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aep-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e .

      # faster-whisper 모델 → 캐시
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-medium-en-v1

      - name: Run cron fetch (CI: STT 만, vocab 은 로컬에서)
        env:
          AEP_WHISPER_DEVICE: cpu
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m ingest.cron_fetch --rss-limit 30 --limit 5 --no-vocab
