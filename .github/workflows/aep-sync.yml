# Daily ingest of new episodes -> write to Supabase.
# Results (transcript/vocab/tts) go straight into Supabase Postgres + Storage (no data repo).
#
# Required repo secrets:
#   SUPABASE_URL          - project URL
#   SUPABASE_SERVICE_KEY  - service_role key (bypasses RLS)
#
# vocab extraction (claude CLI) is hard to auth in CI, so here we pass --no-vocab.
# vocab + TTS are produced locally (Claude Max) via `python -m ingest.cron_fetch`.

name: aep-sync

on:
  schedule:
    # daily 16:00 UTC (01:00 KST)
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aep-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      # cache the faster-whisper model
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-medium-en-v1

      - name: Run cron fetch (CI does STT only; vocab runs locally)
        env:
          AEP_WHISPER_DEVICE: cpu
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m ingest.cron_fetch --rss-limit 30 --limit 5 --no-vocab
