# Daily ingest of new episodes -> write to Supabase.
# Results (transcript/vocab/tts) go straight into Supabase Postgres + Storage (no data repo).
#
# Required repo secrets:
#   SUPABASE_URL          - project URL
#   SUPABASE_SERVICE_KEY  - service_role key (bypasses RLS)
#
# vocab extraction (claude CLI) is hard to auth in CI, so here we pass --no-vocab.
# vocab + TTS are produced locally (Claude Max) via `python -m ingest.cron_fetch`.

name: aep-sync

on:
  schedule:
    # daily 16:00 UTC (01:00 KST)
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # aep-backfill 과 같은 그룹 — 둘 다 'transcribed_at IS NULL' 큐를 집으므로
  # 겹치면 같은 에피소드를 두 번 STT 한다. 취소 대신 직렬화한다.
  group: aep-stt
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      # cache the faster-whisper model
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-medium-en-v1

      - name: Run cron fetch (CI does STT only; vocab runs locally)
        env:
          AEP_WHISPER_DEVICE: cpu
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # 건수(--limit)가 아니라 *시간* 으로 제한한다. CI job 은 시간으로 잘리므로 건수로 세면
        # 마지막 에피소드가 STT 도중 강제 종료되고 그 연산이 통째로 버려진다(실측: 매일 발생).
        # 예산 50분 + 셋업 ≈ 6분 < timeout 60분.
        run: python -m ingest.cron_fetch --rss-limit 30 --time-budget-min 50 --no-vocab
