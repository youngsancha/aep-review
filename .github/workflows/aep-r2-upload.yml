# 신규 회차 자동 호스팅(클라우드) — megaphone clean 오디오 → Cloudflare R2 업로드 → 그 R2 오디오로
# 재STT(scripts.retranscribe --from-r2)해 r2_audio=true + 매니페스트 등재까지 한 번에.
#
# 왜: megaphone 는 동적광고(DAI)라 재생마다 광고 길이가 달라, cron 이 megaphone 자막만 만든 신규
# 회차는 미드롤 광고 이후 자막이 밀린다(사용자 보고 2026-07-17, ep521 shark attack). R2 호스팅 회차는
# 자막이 '서빙 오디오 그 자체'로 STT 되어 광고를 지나도 완벽 싱크. 이 워크플로가 그 호스팅을 자동화한다.
#
# 로컬 PC 네트워크가 R2 S3 엔드포인트를 막아(그리고 R2 자격증명도 로컬엔 없음) CI 에서만 가능.
# aep-sync(01:00 KST) 로 신규 인제스트+STT 후, 이 잡이 02:00 KST 에 그 신규 회차를 호스팅한다.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY,
#   R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET

name: aep-r2-upload

on:
  schedule:
    # daily 17:00 UTC (02:00 KST) — aep-sync(16:00 UTC) 한 시간 뒤, 신규 회차 인제스트 완료 후
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행 업로드 상한(이미 올라간 건 자동 스킵)"
        default: "300"
      redo:
        description: "이미 있어도 다시 업로드(true/false)"
        default: "false"
      retranscribe_recent:
        description: "재STT 후보 범위(최신 N개 안에서 고른다). 과거 회차를 잡으려면 크게."
        default: "12"
      retranscribe_limit:
        description: "재STT 실제 처리 상한(건수). 시간 예산이 먼저 걸리면 그 전에 멈춘다."
        default: "12"
      retranscribe_budget_min:
        description: "재STT 시간 예산(분). job timeout(350) 보다 작게."
        default: "300"

permissions:
  contents: read

concurrency:
  group: aep-r2-upload
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 업로드 + 재STT 둘 다 하므로 faster-whisper 포함 전체 설치
      - name: Install
        run: pip install -e .

      # cache the faster-whisper model (aep-sync 와 동일 키로 공유)
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-medium-en-v1

      # ① megaphone clean 오디오 → R2 (이미 올라간 건 스킵)
      - name: Upload audio to R2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >
          python -m scripts.upload_audio_r2
          --limit ${{ github.event.inputs.limit || '300' }}
          ${{ github.event.inputs.redo == 'true' && '--redo' || '' }}

      # ② 방금 올린 R2 오디오로 재STT → r2_audio=true + mark_hosted (신규만, CPU STT)
      #    R2_PUBLIC_BASE 는 공개 URL(비밀 아님) — ui/config.js 와 동일 오리진.
      - name: Retranscribe new episodes from R2 (perfect sync)
        env:
          AEP_WHISPER_DEVICE: cpu
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_PUBLIC_BASE: https://pub-6226ae33abbc474dbea6ae140582eb8d.r2.dev
        # --recent(후보 범위)와 --limit(처리 상한)은 별개다. 예전엔 한 입력이 둘 다 채워서,
        # 범위를 넓히면 처리량도 같이 커져 job timeout 에 걸렸다. 실제 제동은 시간 예산이 건다.
        run: >
          python -m scripts.retranscribe --from-r2 --skip-hosted
          --recent ${{ github.event.inputs.retranscribe_recent || '12' }}
          --limit ${{ github.event.inputs.retranscribe_limit || '12' }}
          --time-budget-min ${{ github.event.inputs.retranscribe_budget_min || '300' }}
