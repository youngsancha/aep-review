# megaphone clean 오디오 → Cloudflare R2 업로드 (클라우드에서 실행).
# 로컬 PC 네트워크가 R2 S3 엔드포인트를 막아도 CI 에서는 정상. '오디오 업로드만' 한다.
# 이후 로컬 GPU 가 R2 오디오를 받아 자막을 재생성(scripts.retranscribe --from-r2)해 싱크를 맞춘다.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY,
#   R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET

name: aep-r2-upload

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행 업로드 상한(이미 올라간 건 자동 스킵)"
        default: "300"
      redo:
        description: "이미 있어도 다시 업로드(true/false)"
        default: "false"

permissions:
  contents: read

concurrency:
  group: aep-r2-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # 업로드 전용 — 무거운 faster-whisper 없이 필요한 것만 설치(빠르고 안정적)
      - name: Install (upload-only deps)
        run: pip install "boto3>=1.34" "supabase>=2.4" "httpx>=0.28" "feedparser>=6.0" "edge-tts>=7.0" "python-dotenv>=1.0"
      - name: Upload audio to R2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >
          python -m scripts.upload_audio_r2
          --limit ${{ github.event.inputs.limit }}
          ${{ github.event.inputs.redo == 'true' && '--redo' || '' }}
