<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#cc6cff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>American English Podcast</title>

  <script>
    window.APP_VERSION = '136';
    // 페인트 전에 저장된 테마를 적용해 깜빡임 방지 (auto 면 시스템 설정에 맡김)
    (function () { try {
      var t = localStorage.getItem('aep-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {} })();
    (function () {
      const v = '?v=' + window.APP_VERSION;
      const css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = '/style.css' + v;
      document.head.appendChild(css);

      const paths = [
        '/app.js', '/tts.js', '/player.js', '/media-session.js', '/scrub.js',
        '/config.js', '/supabase.js', '/db.js',
        '/views/timeline.js', '/views/episode.js', '/views/srs.js', '/views/study.js', '/views/login.js',
        '/views/essentials.js',
      ];
      const map = {imports: {}};
      paths.forEach((p) => { map.imports[p] = p + v; });
      const im = document.createElement('script');
      im.type = 'importmap';
      im.textContent = JSON.stringify(map);
      document.head.appendChild(im);

      const main = document.createElement('script');
      main.type = 'module';
      main.src = '/app.js' + v;
      document.head.appendChild(main);
    })();
  </script>
</head>
<body>
  <header id="topbar">
    <button id="back-btn" hidden aria-label="Back">‹</button>
    <div id="brand">
      <img id="brand-icon" src="/icons/icon-64.png" alt="" />
      <h1 id="page-title">Episodes</h1>
    </div>
    <span id="app-version">v?</span>
    <button id="theme-btn" class="theme-switch" role="switch" aria-checked="false" aria-label="Toggle light/dark theme">
      <span class="theme-track"><span class="theme-ico sun">☀️</span><span class="theme-ico moon">🌙</span><span class="theme-knob"></span></span>
    </button>
    <button id="sync-btn" aria-label="Sync">↻</button>
  </header>

  <main id="app"></main>

  <div id="miniplayer" class="hidden" aria-hidden="true">
    <img id="mp-cover" class="mp-cover" alt="" />
    <div class="mp-body">
      <div id="mp-title" class="mp-title">—</div>
      <div id="mp-sub" class="mp-sub">—</div>
    </div>
    <button id="mp-play" class="mp-btn" aria-label="Play/Pause">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
    </button>
    <button id="mp-fwd" class="mp-btn" aria-label="Forward 30s">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.5-7.1"/><polyline points="21 4 21 10 15 10"/></svg>
    </button>
    <div class="mp-progress" id="mp-progress">
      <span class="mp-progress-rail"></span>
      <span id="mp-progress-fill"></span>
      <span id="mp-progress-handle"></span>
    </div>
  </div>

  <nav id="tabbar">
    <a href="#/"      data-tab="timeline"><span class="icon">🎧</span><span class="label">Library</span></a>
    <a href="#/study" data-tab="study"><span class="icon">📚</span><span class="label">Study</span></a>
  </nav>
</body>
</html>
